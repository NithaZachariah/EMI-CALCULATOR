<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMI Calculator</title>
  <link rel="stylesheet" href="nitha.css">
</head>
<body>

  <div class="container">
    <h1>💰 EMI Calculator</h1>

    <div class="form-group">
      <label for="loanAmount">Loan Amount (₹):</label>
      <input type="number" id="loanAmount" placeholder="Enter loan amount">
    </div>

    <div class="form-group">
      <label for="interestRate">Annual Interest Rate (%):</label>
      <input type="number" id="interestRate" placeholder="Enter annual interest rate">
    </div>

    <div class="form-group">
      <label for="loanTenure">Loan Tenure (Months):</label>
      <input type="number" id="loanTenure" placeholder="Enter loan tenure in months">
    </div>

    <button id="calculateBtn">Calculate EMI</button>

    <div id="result" class="result">
      <h2>Calculation Result</h2>
      <p><strong>Loan Amount:</strong> ₹<span id="displayLoan"></span></p>
      <p><strong>Monthly EMI:</strong> ₹<span id="displayEMI"></span></p>
      <p><strong>Total Interest:</strong> ₹<span id="displayInterest"></span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
